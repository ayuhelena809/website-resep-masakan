
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - Dapur Nusantara</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <h2 class="logo">Dapur<span>Nusantara</span></h2>
        <ul class="menu">
            <li><a href="index.html">Beranda</a></li>
            <li><a href="resep.html">Resep</a></li>
            <li><a href="tentang.html">Tentang Kami</a></li>
            <li><a href="kontak.html" class="aktif">Kontak</a></li>
        </ul>
    </nav>

    <section class="kontak">
        <div class="judul-kontak">
            <h1>Hubungi Kami</h1>
            <p>
                Punya pertanyaan atau saran?
                Silakan tuliskan pesan melalui formulir berikut.
            </p>
        </div>

        <form class="form-kontak" id="formKontak">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" placeholder="Masukkan nama kamu" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Masukkan email kamu" required>

            <label for="pesan">Pesan</label>
            <textarea id="pesan" rows="6"
                placeholder="Tuliskan pesan kamu..." required></textarea>

            <button type="submit">Kirim Pesan</button>
            <p id="statusPesan"></p>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Dapur Nusantara. Semua Hak Dilindungi.</p>
    </footer>

    <script>
        document.getElementById("formKontak").addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("statusPesan").textContent =
                "Formulir berhasil diisi. Fitur pengiriman pesan belum terhubung ke server.";

            this.reset();
        });
    </script>

</body>
</html>
